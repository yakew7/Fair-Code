name: Frozen Files

# The paper freeze has lifted (see CLAUDE.md) - this workflow no longer
# blocks any file. It's kept as a no-op, rather than deleted, because
# `check-frozen-files` is a required status check in the repo's branch
# protection ruleset; removing the job entirely would leave that check
# permanently "expected" and never reported, blocking every future merge.
# Changing the ruleset itself is a repo-admin action outside what this
# workflow file can or should do on its own - if the required-check
# requirement should also be dropped, update the ruleset directly in
# GitHub's branch protection settings.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-frozen-files:
    runs-on: ubuntu-latest
    steps:
      - name: No-op (freeze lifted)
        run: echo "Paper freeze lifted - no files are protected anymore."
