# Pre-commit hooks mirroring Fair Code CI. See CONTRIBUTING.md.
# One-time install:  pre-commit install
# Run against the whole repo:  pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: em-dash
        name: em-dash-free check
        entry: python3 scripts/check_em_dash.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff (unused imports, undefined names, redefinitions)
        entry: ruff check faircode scripts tests
        language: system
        pass_filenames: false
        always_run: true

      - id: build-explainers
        name: regenerate explainer pages
        entry: python3 scripts/build_explainers.py
        language: system
        pass_filenames: false
        files: '^(explainers/.*\.md|assets/explainers-data\.json|assets/explainers-ui\.js)$'

      - id: generate-og-images
        name: regenerate OG/Twitter social preview images
        entry: python3 scripts/generate_og_images.py
        language: system
        pass_filenames: false
        files: '^(explainers/.*\.md|assets/explainers-data\.json|scripts/generate_og_images\.py)$'

      - id: check-broken-links
        name: check for broken internal markdown links
        entry: python3 scripts/check_broken_links.py
        language: system
        pass_filenames: false
        files: '\.md$'

      - id: check-explainer-count
        name: check "current explainer count" mentions haven't drifted
        entry: python3 scripts/check_explainer_count.py
        language: system
        pass_filenames: false
        files: '^(explainers/.*\.md|README\.md|CONTRIBUTORS\.md|METRICS\.md|ROADMAP\.md)$'

      - id: check-explainer-structure
        name: check explainers have the required sections
        entry: python3 scripts/check_explainer_structure.py
        language: system
        pass_filenames: false
        files: '^(explainers/.*\.md|scripts/check_explainer_structure\.py)$'

      - id: check-issue-refs
        name: check issue numbers cited in ROADMAP, CHANGELOG, CONTRIBUTORS and METRICS (skipped without gh)
        entry: python3 scripts/check_issue_refs.py
        language: system
        pass_filenames: false
        files: '^(ROADMAP\.md|CHANGELOG\.md|CONTRIBUTORS\.md|METRICS\.md|scripts/check_issue_refs\.py)$'

      - id: check-traction
        name: check traction figures agree across README, ROADMAP and METRICS
        entry: python3 scripts/check_traction.py
        language: system
        pass_filenames: false
        files: '^(README\.md|ROADMAP\.md|METRICS\.md|scripts/check_traction\.py)$'

      - id: check-dataset-sources
        name: check dataset source links agree between the README and the audit scripts
        entry: python3 scripts/check_dataset_sources.py
        language: system
        pass_filenames: false
        files: '^(README\.md|scripts/check_dataset_sources\.py|.*/(fair|unfair)\.py)$'

      - id: check-contributors
        name: check CONTRIBUTORS.md matches the merged pull requests (skipped without gh)
        entry: python3 scripts/check_contributors.py
        language: system
        pass_filenames: false
        files: '^(CONTRIBUTORS\.md|scripts/check_contributors\.py|scripts/contributors-exceptions\.json)$'

      - id: pytest
        name: pytest (fast suite, skips slow benchmark tests)
        entry: python3 -m pytest tests/ -q -m "not slow" --ignore=tests/browser
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '^(faircode/.*|scripts/.*|tests/.*|assets/(profiler-engine\.js|profiler-compare\.js|profiler-ui\.js)|pyproject\.toml|requirements(-lock)?\.txt|\.github/CODEOWNERS|.*\.csv|.*/(fair|unfair)\.py|.*/audit\.yaml)$'
