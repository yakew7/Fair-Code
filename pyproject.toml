[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faircode"
version = "2.3.0"
description = "Diagnostic profiler that audits a tabular dataset for demographic representation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yash Kewlani" }]
keywords = ["fairness", "bias", "dataset", "profiling", "demographics", "audit"]
dependencies = [
    "pandas>=2.0",
    "Pillow>=11.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
parquet = ["pyarrow>=10.0"]
proxy = ["scipy>=1.10"]
benchmark = ["scikit-learn>=1.8.0", "pyyaml>=6.0", "fairlearn>=0.14.0", "matplotlib>=3.10"]
mcp = ["mcp>=2.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.5", "certifi>=2023.1.1", "pyyaml>=6.0"]   # pytest-xdist: parallel make test-fast and make coverage; certifi: scripts/check_external_links.py trust store fallback; pyyaml: workflow safeguard tests
browser = ["playwright>=1.40"]   # tests/browser; also run `python -m playwright install chromium`

[project.urls]
Homepage = "https://github.com/yakew7/Fair-Code"
Website = "https://www.thefaircode.xyz"

[project.scripts]
faircode = "faircode.cli:main"
faircode-mcp = "faircode.mcp_server:main"

[tool.setuptools]
packages = ["faircode"]

[tool.setuptools.package-data]
faircode = [
    "SPEC.md", "MANIFEST_SPEC.md",
    "_explainers/*.md", "_explainers/data.json",
    "_results_frozen/*.csv", "_results_current/*.csv",
]

[tool.pytest.ini_options]
# The repo root (for `import scripts.*`) and tests/ (for the shared js_helpers module) work in every
# import mode, including --import-mode=importlib (#945).
pythonpath = [".", "tests"]
markers = [
    "slow: trains models (tests/test_benchmark.py); skip locally with -m \"not slow\", CI runs everything",
    "browser: opens the real pages in Chromium through Playwright (tests/browser); skipped when Playwright is missing",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Real bugs only (unused imports, undefined names, redefinitions) - Pyflakes'
# full rule set. Deliberately narrower than ruff's own default (E4, E7, E9,
# F): E4 includes E402, which false-positives on tests/*.py's
# `pytest.importorskip(...)` then `from x import y` guard idiom (used in
# test_metrics.py, test_proxy.py, test_strategies.py, and elsewhere) -
# flagging that would be exactly the style churn this check should avoid.
select = ["F"]
